<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="stylesheet" href="store.css">
    <script type="text/javascript" src="DOMPurify-3.0.6/dist/purify.min.js"></script>
    <script src="store.js"></script>
</head>

<body>
    <div id="response"></div>
    <h1>Cool Rings company</h1>

    <h2>Rings with cool colors</h2>

    <div class="whole">

        
        <ul class="itemPics">
            <li>
                <img src="colors/blue.jpg" alt="Image 1">
            <div class="itemText">Blue ring, 100kr</div>
            <button style="background-color: #8bb9dc; /* Green */
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;" onclick="addToCart('Blue')">Add to Cart</button>
        </li>
        <li>
            <img src="colors/yellow.jpg" alt="Image 2">
            <div class="itemText">Yellow ring, 200kr</div>
            <button style="background-color: rgb(223, 183, 50); /* Green */
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;" onclick="addToCart('Yellow')">Add to Cart</button>
        </li>
        <li>
            <img src="colors/green.jpg" alt="Image 3">
            <div class="itemText">Green ring, 300kr</div>
            <button style="background-color: #5a975c; /* Green */
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;" onclick="addToCart('Green')">Add to Cart</button>
        </li>
        <li>
            <img src="colors/red.jpg" alt="Image 4">
            <div class="itemText">Red ring, 400kr</div>
            <button style="background-color: rgb(225, 55, 55); /* Green */
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;" onclick="addToCart('Red')">Add to Cart</button>
        </li>
        <li>
            <img src="colors/orange.jpg" alt="Image 5">
            <div class="itemText">Orange ring, 500kr</div>
            <button style="background-color: rgb(219, 104, 32); /* Green */
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;" onclick="addToCart('Orange')">Add to Cart</button>
        </li>
    </ul>
    
    <h2>Shopping Cart</h2>
    <ul id="shoppingCart"></ul>
    
    <div>
        <h3>Total cost: <span id="totalCost">0kr</span></h3>
    </div>

    <button id="payButton" onclick="pay()" style="background: linear-gradient(to bottom right, red, blue); 
    border: none; 
    color: white; 
    padding: 15px 32px; 
    text-align: center; 
    text-decoration: none; 
    display: inline-block; 
    font-size: 16px; 
    margin: 4px 2px; 
    cursor: pointer;">Pay</button>

    <div class="CreateReview">
        <h3>Reviews</h3>
        <h4>We would be glad to hear your input! Please do not hack us with un XSS attack!</h4>
        <form id="review-form">
            <label for="name">Name:</label>
            <span id="name"><script>document.write(document.cookie.split('=')[1])</script></span>
            <label for="review">Review:</label>
            <input type="text" id="review" name="review" required>
            <button type="button" onclick="submitReview()">Submit</button>
        </form>
    </div>

    <div class="reviews">
        <ul id="reviews"></ul>
        
    </div>




</div>

</body>

</html>
